name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly Mon 06:00 UTC — re-scan the unchanged Cargo.lock for new advisories
  workflow_dispatch:

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe     # v2
        with:
          tool: cargo-deny@0.19.9
      - name: cargo-deny (advisories, licenses, sources, bans)
        run: cargo deny check
